name: "Visually compare PDFs"
description: "A PDF diff action for regression tests"

inputs:
  output-directory:
    description: "The output directory containing the visual diffs"
    required: true
  directory-a:
    description: "The 'a' input directory"
    required: true
  directory-b:
    description: "The 'b' input directory"
    required: true
  dpi:
    description: "The dpi setting for the visual conversion"
    required: false
    default: "100"
  python-version:
    description: "Python version"
    required: false
    default: "3.15"

runs:
  using: "composite"
  steps:
    - name: Set up python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        # No pip cache here: setup-python resolves cache-dependency-path
        # relative to the caller's workspace, so it cannot see this
        # action's own requirements.txt.

    - name: Cache pip downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ inputs.python-version }}-${{ github.action_ref }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Create visual diff
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-directory }}/"
        find "${{ inputs.directory-a }}" -type f -name '*.pdf' -print0 |
          while IFS= read -r -d '' i; do
            rel="${i#${{ inputs.directory-a }}/}"
            out="${{ inputs.output-directory }}/${rel%.pdf}"
            mkdir -p "$out" &&
              diffpdf --dpi "${{ inputs.dpi }}" --skip-compare-text --output-dir "$out" \
                "$i" "${{ inputs.directory-b }}/$rel"
          done
